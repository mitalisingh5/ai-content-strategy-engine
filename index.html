    <script>
      // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      a, button, [role="button"] {
          cursor: pointer;
      }
      input, textarea {
          cursor: text;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.6s ease-out forwards;
      }
      
      @keyframes float-bob {
        0%, 100% {
          transform: translateY(-4px);
        }
        50% {
          transform: translateY(4px);
        }
      }
      .animate-float-bob {
        animation: float-bob 4s ease-in-out infinite;
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slideInUp {
        animation: slideInUp 0.3s ease-out forwards;
      }

      .glow-card {
          position: relative;
          overflow: hidden; /* Ensures the glow doesn't spill out */
      }

      .glow-card::before {
          content: "";
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background: radial-gradient(
              350px circle at var(--mouse-x, -100px) var(--mouse-y, -100px), /* Default position off-screen */
              rgba(0, 105, 92, 0.2), /* Light-theme glow color (primary) */
              transparent 80%
          );
          border-radius: inherit;
          opacity: 0;
          transition: opacity 0.3s ease-out;
          z-index: 0;
      }

      .dark .glow-card::before {
          background: radial-gradient(
              350px circle at var(--mouse-x, -100px) var(--mouse-y, -100px),
              rgba(0, 105, 92, 0.4), /* Dark-theme glow color (brighter) */
              transparent 80%
          );
      }

      .glow-card:hover::before {
          opacity: 1;
      }

      /* Ensure card content is rendered above the glow effect */
      .glow-card > * {
          position: relative;
          z-index: 1;
      }
    </style>
